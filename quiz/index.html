    .option { font: inherit; text-align: left; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; font-size: 1.02rem; line-height: 1.45; cursor: pointer; transition: border-color .15s, transform .15s; }
    .option:hover, .option:focus-visible { border-color: var(--lime); transform: translateY(-1px); outline: none; }
    .option.right { border-color: var(--lime); background: rgba(203,255,90,.14); }
    .option.wrong { border-color: var(--orange); background: rgba(255,139,77,.12); }
    .cta { font: inherit; font-weight: 900; font-size: 1.05rem; color: #0b0b11; background: var(--lime); border: 0; border-radius: 999px; padding: 15px 26px; cursor: pointer; text-decoration: none; display: inline-block; }
    .cta.secondary { color: var(--ink); background: var(--panel); border: 1px solid var(--line); }

    .timer span { display: block; height: 100%; width: 100%; background: var(--orange); }
    .feedback { margin: 18px 0 0; color: #d7d7d2; }
    .result-type { font-size: clamp(2.2rem, 8vw, 3.4rem); line-height: 1; letter-spacing: -.03em; margin: 6px 0 16px; color: var(--lime); }
    .fortune { font-size: 1.12rem; color: #e9e9e4; margin: 0 0 24px; }
    .why { list-style: none; padding: 0; margin: 0 0 28px; display: grid; gap: 10px; }
    .why li { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 12px 40px; position: relative; }
    .why li::before { content: "✓"; position: absolute; left: 15px; top: 11px; color: var(--lime); font-weight: 900; }
    .game-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; margin: 0 0 22px; }
    .game-head { display: flex; gap: 16px; align-items: center; margin-bottom: 12px; }
    .game-head img { width: 72px; height: 72px; border-radius: 18px; }
    .game-head h3 { margin: 0; font-size: 1.5rem; line-height: 1.1; }
    .game-head p { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }
    .made-for { font-weight: 800; font-size: 1.05rem; margin: 14px 0 18px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .also { display: grid; gap: 10px; margin: 0 0 26px; }
    .also a { display: flex; gap: 12px; align-items: center; text-decoration: none; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; }
    .also img { width: 40px; height: 40px; border-radius: 10px; }
    .small { color: var(--muted); font-size: .9rem; }
    .mix { display: grid; gap: 10px; margin: 0 0 26px; }
    .mix-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-weight: 700; }
    .mix-row .pct { color: var(--muted); }
    .mix-bar { grid-column: 1 / -1; height: 8px; background: var(--panel); border-radius: 999px; overflow: hidden; }
    .mix-bar span { display: block; height: 100%; background: var(--violet); }
    .mix-row:first-child .mix-bar span { background: var(--lime); }
    details.all-types { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; margin: 0 0 26px; }
    details.all-types summary { cursor: pointer; font-weight: 800; }

    details.all-types dt { font-weight: 800; margin-top: 10px; }
    details.all-types dt.mine { color: var(--lime); }
    details.all-types dd { margin: 2px 0 0; color: #d7d7d2; }
    [hidden] { display: none !important; }
  </style>

      comeback: ['Ang Bumabalik', 'Hindi ikaw ang pumalya sa English. Pinalya ka ng mga boring na app. Tumigil ka nang hindi na masaya, at walang nakapansin. Ngayon kailangan mo ng dahilan para bumalik araw-araw, at taong makakapansin kapag hindi ka bumalik. Isipin mo {who}: sila ang dahilan mo.'],
      gamebrain: ['Utak Gamer', 'Natututo ka sa paggawa, hindi sa pagme-memorize. Sa sandaling maging parang assignment, nawawala ang interes mo. Itago ang pag-aaral sa laro at magugulat ka kung gaano karami ang tatatak.'],
      fresh: ['Bagong Simula', 'Hindi mo kailangan ng libro. Kailangan mo ng unang hakbang na kaya mong gawin ngayon, at mga salitang talagang magagamit mo kasama {who}.'],

    },
    typeShort: {

    allTypes: 'Tingnan ang 5 learner type',
    whyLabel: 'Paano namin nalaman',
    features: {
      friends: 'Imbitahin ang pamilya o barkada at magtuloy ng streak nang sabay. May makakapansin kapag lumiban ka.',
      game: 'Laro muna ito. Maglalaro ka, hindi mag-aaral.',
      useful: 'Hindi na puro «cat» at «dog»: mga salitang talagang gagamitin mo.',
      small: 'Maliliit na lesson, 10 salita lang kada araw, may kasamang flashcards.',
      spelling: 'Ikaw ang nagta-type ng sagot, kaya tumatatak ang spelling.',
      both: 'Magpa-practice ka sa dalawang direksyon: English → Tagalog at Tagalog → English.',
      errors: 'May error counter na nagtatala ng mga salitang lagi mong mali, para ma-practice mo ang mahina mo.',
      duels: 'Hamunin ang barkada sa duel. Nakaka-motivate ang matalo sa pinsan mo.',
      speed: "Ang mga timed round ay nagtuturo sa'yong sumagot bago lumipas ang moment.",
      words: 'Hanggang 900 salita, kaya laging may susunod na level.',
      pressure: 'Bawat round ay nilalaro nang may pressure, mismong oras na dati ay nawawala ang mga salita.',
      recall: 'Kapag mabilis kang nakakaalala, malaya ang isip mong makuha ang slang at kasabihan.',
      all: 'Tatlong laro, tatlong bilis. Laging may nasa level mo.'
    },
    tenADay: 'Sapat na ang 10 salita kada araw.',
    yourGame: "Ginawa para sa'yo",
    blurbs: {
      lt: 'Lumaban sa mga mundo ng kwento kung saan bawat tamang sagot ay isang tama sa kalaban.',
      wb: 'Saluhin ang mga bumabagsak na salita bago umabot sa itaas. Arcade na nagtuturo ng 600 salita.',
      tomato: 'Tulungan ang espiyang kamatis na tumakas sa pabrika ng sarsa. Bawat gate ay nabubuksan ng isang salita.'
    },
    words: '{n} salita · libreng i-download',
    madeFor: 'Ginawa ang larong ito para sa klase mo ng pag-aaral. Dinisenyo ito para makalimutan mong nag-aaral ka, at bigyan ka ng tools para magsimulang magsalita.',
    plan: 'Ang plano mo: 10 salita kada araw.',
    download: 'I-download nang libre',
    soon: 'Malapit na. Tingnan ang laro',
    meanwhile: 'Magsimula ngayon habang naghihintay:',
    also: "Bagay din sa'yo:",
    share: 'I-share ang resulta ko',
    shareText: 'Ako ay «{type}». Ano ang learner type mo?',
    copied: 'Nakopya ang link!',
    retake: 'Ulitin ang quiz'
  }
};

var lang = 'en';
var state;
var steps;
var stepIndex;
var screen = document.getElementById('screen');
var bar = document.getElementById('bar');
var stepLabel = document.getElementById('stepLabel');
var challengeTimer = null;

function fmt(s, vars) { return s.replace(/\{(\w+)\}/g, function (_, k) { return vars[k]; }); }
function el(tag, attrs, children) {
  var e = document.createElement(tag);
  for (var k in attrs || {}) {
    if (k === 'text') e.textContent = attrs[k];
    else if (k === 'onclick') e.onclick = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (children || []).forEach(function (c) { if (c) e.appendChild(c); });
  return e;
}

function pickLang() {
  var q = new URLSearchParams(location.search).get('lang');
  if (q && T[q]) return q;
  var nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
  if (nav === 'es') return 'es';
  if (nav === 'tl' || nav === 'fi') return (navigator.language || '').toLowerCase().indexOf('fil') === 0 || nav === 'tl' ? 'tl' : 'en';
  return 'en';
}

function setLang(l) {
  lang = l;
  document.documentElement.lang = l === 'tl' ? 'fil' : l;
  document.querySelectorAll('.langs button').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === l));
  });
  restart();
}

function restart() {
  clearInterval(challengeTimer);
  state = { family: null, level: null, struggle: null, challenge: null, fun: null, time: null };
  steps = (T[lang].family ? ['family'] : []).concat(['level', 'struggle', 'challenge', 'fun', 'time']);
  stepIndex = -1;
  renderIntro();
}

function setProgress() {
  var total = steps.length;
  bar.style.width = (stepIndex < 0 ? 0 : Math.min(stepIndex / total, 1) * 100) + '%';
  stepLabel.textContent = stepIndex >= 0 && stepIndex < total ? fmt(T[lang].stepOf, { n: stepIndex + 1, t: total }) : '';
}

function renderIntro() {
  var t = T[lang];
  setProgress();
  screen.replaceChildren(
    el('p', { class: 'eyebrow', text: t.eyebrow }),
    el('h1', { text: t.title }),
    el('p', { class: 'lede', text: t.intro }),
    el('p', {}, [el('button', { class: 'cta', type: 'button', text: t.start, onclick: next })])
  );
}

function next() {
  stepIndex++;
  setProgress();
  if (stepIndex >= steps.length) return renderResult();
  ({ family: renderFamily, level: renderLevel, struggle: renderStruggle, challenge: renderChallenge, fun: renderFun, time: renderTime })[steps[stepIndex]]();
  window.scrollTo(0, 0);
}

function question(title, labels, onPick) {
  screen.replaceChildren(
    el('h2', { text: title }),
    el('div', { class: 'options' }, labels.map(function (label, i) {
      return el('button', { class: 'option', type: 'button', text: label, onclick: function () { onPick(i); next(); } });
    }))
  );
}

function renderFamily() { var t = T[lang]; question(t.family, t.families, function (i) { state.family = FAMILY[i]; }); }
function renderLevel() { var t = T[lang]; question(t.level, t.levels, function (i) { state.level = 'ABCD'[i]; }); }
function renderStruggle() {
  var t = T[lang];
  question(t.struggleQ[state.level], t.struggle[state.level], function (i) { state.struggle = STRUGGLE[state.level][i]; });
}
function renderFun() { var t = T[lang]; question(t.funQ, t.fun, function (i) { state.fun = FUN[i]; }); }
function renderTime() { var t = T[lang]; question(t.timeQ, t.times, function (i) { state.time = i; }); }

function renderChallenge() {
  var t = T[lang];
  var timerFill = el('span');
  var feedback = el('p', { class: 'feedback' });
  var nextBtn = el('button', { class: 'cta', type: 'button', text: t.next, onclick: next, hidden: '' });
  var buttons = t.challengeOpts.map(function (label, i) {
    return el('button', { class: 'option', type: 'button', text: label, onclick: function () { finish(i === 0, i); } });
  });
  // Shuffle the answers so "Dog" isn't always first.
  var shuffled = buttons.slice().sort(function () { return Math.random() - 0.5; });
  var done = false;
  function finish(right, i) {
    if (done) return;
    done = true;
    clearInterval(challengeTimer);
    state.challenge = right;
    buttons[0].classList.add('right');
    if (!right && i !== undefined) buttons[i].classList.add('wrong');
    buttons.forEach(function (b) { b.disabled = true; });
    feedback.textContent = right ? t.challengeRight : t.challengeMissed;
    nextBtn.hidden = false;
    nextBtn.focus();
  }
  screen.replaceChildren(
    el('p', { class: 'eyebrow', text: t.challengeTitle }),
    el('h2', { text: t.challengeQ }),
    el('div', { class: 'timer' }, [timerFill]),
    el('div', { class: 'options' }, shuffled),
    feedback,
    el('p', {}, [nextBtn])
  );
  var startedAt = Date.now();
  challengeTimer = setInterval(function () {
    var left = Math.max(0, 1 - (Date.now() - startedAt) / 5000);
    timerFill.style.width = (left * 100) + '%';
    if (left === 0) finish(false);
  }, 50);
}

// Every answer nudges the five learner types; the struggle answer counts most,
// so it is always the top type. Returns the top three as rounded percentages.
var TYPES = ['comeback', 'gamebrain', 'fresh', 'hidden', 'pressure'];
function learnerMix() {
  var s = { comeback: 0, gamebrain: 0, fresh: 0, hidden: 0, pressure: 0 };
  function add(type, n) { s[type] += n; }
  add(state.struggle[0], 6);
  ({ A: [['fresh', 1], ['gamebrain', 1]], B: [['hidden', 1], ['comeback', 1]],
     C: [['hidden', 1], ['comeback', 1]], D: [['pressure', 2], ['hidden', 1]] })[state.level]
    .forEach(function (p) { add(p[0], p[1]); });
  if (state.challenge) add('gamebrain', 1); else { add('pressure', 1); add('hidden', 1); }
  ({ battle: [['comeback', 1]], puzzle: [['fresh', 1]], adventure: [['gamebrain', 1]], anything: [['gamebrain', 2]] })[state.fun]
    .forEach(function (p) { add(p[0], p[1]); });
  add(['fresh', 'comeback', 'gamebrain'][state.time], 1);
  // Make sure there are always three types with a share.
  TYPES.forEach(function (t) { add(t, 1); });

  var top = TYPES.slice().sort(function (a, b) {
    return s[b] - s[a] || (b === state.struggle[0]) - (a === state.struggle[0]);
  }).slice(0, 3);
  var total = top.reduce(function (n, t) { return n + s[t]; }, 0);
  var pcts = top.map(function (t) { return Math.round(s[t] / total * 100); });
  pcts[0] += 100 - pcts.reduce(function (a, b) { return a + b; }, 0);
  return top.map(function (t, i) { return [t, pcts[i]]; });
}

function chooseGame() {
  var serious = state.level === 'C' || state.level === 'D';
  var bored = state.struggle[0] === 'gamebrain';
  if (!serious && (bored || state.fun === 'adventure' || state.fun === 'anything')) return 'tomato';
  if (state.fun === 'battle' || state.fun === 'adventure') return 'lt';
  return 'wb';
}

function storeLink(key) {
  var g = GAMES[key];
  return g.get ? g.get + '?s=quiz_' + lang : null;
}

function gameCard(key, t) {
  var g = GAMES[key];
  var actions = el('div', { class: 'actions' });
  var link = storeLink(key);
  var meanwhile = null;
  if (link) {
    actions.appendChild(el('a', { class: 'cta', href: link, text: t.download }));
  } else {
    actions.appendChild(el('a', { class: 'cta secondary', href: g.page, text: t.soon }));
    var alt = state.fun === 'battle' ? 'lt' : 'wb';
    meanwhile = el('p', { class: 'small' }, [
      document.createTextNode(t.meanwhile + ' '),
      el('a', { href: storeLink(alt), text: GAMES[alt].name })
    ]);
  }
  return el('div', { class: 'game-card' }, [
    el('p', { class: 'eyebrow', text: t.yourGame }),
    el('div', { class: 'game-head' }, [
      el('img', { src: g.icon, alt: '' }),
      el('div', {}, [el('h3', { text: g.name }), el('p', { text: fmt(t.words, { n: g.words }) })])
    ]),
    el('p', { text: t.blurbs[key] }),
    el('p', { class: 'made-for', text: t.madeFor }),
    actions,
    meanwhile
  ]);
}

function renderResult() {
  var t = T[lang];
  var typeKey = state.struggle[0];
  var featureKey = state.struggle[1];
  var type = t.types[typeKey];
  var who = state.family ? t.who[state.family] : '';
  var fortune = fmt(type[1], { who: who });
  var gameKey = chooseGame();
  var others = ['lt', 'wb', 'tomato'].filter(function (k) { return k !== gameKey; });

  bar.style.width = '100%';
  stepLabel.textContent = '';

  var shareBtn = el('button', { class: 'cta secondary', type: 'button', text: t.share });
  shareBtn.onclick = function () {
    var url = location.origin + location.pathname + '?lang=' + lang;
    var text = fmt(t.shareText, { type: type[0] });
    if (navigator.share) navigator.share({ title: document.title, text: text, url: url }).catch(function () {});
    else if (navigator.clipboard) navigator.clipboard.writeText(text + ' ' + url).then(function () { shareBtn.textContent = t.copied; });
  };

  screen.replaceChildren(
    el('p', { class: 'eyebrow', text: t.typeLabel }),
    el('p', { class: 'result-type', text: type[0] }),
    el('p', { class: 'fortune', text: fortune }),
    el('p', { class: 'eyebrow', text: t.mixLabel }),
    el('div', { class: 'mix' }, learnerMix().map(function (m) {
      var fill = el('span');
      fill.style.width = m[1] + '%';
      return el('div', { class: 'mix-row' }, [
        el('span', { text: t.types[m[0]][0] }),
        el('span', { class: 'pct', text: m[1] + '%' }),
        el('div', { class: 'mix-bar' }, [fill])
      ]);
    })),
    el('p', { class: 'eyebrow', text: t.whyLabel }),
    el('ul', { class: 'why' }, [
      el('li', { text: t.features[featureKey] }),
      el('li', { text: state.challenge ? t.challengeRight : t.challengeMissed }),
      el('li', { text: t.tenADay })
    ]),
    gameCard(gameKey, t),
    el('p', { class: 'eyebrow', text: t.also }),
    el('div', { class: 'also' }, others.map(function (k) {
      return el('a', { href: storeLink(k) || GAMES[k].page }, [
        el('img', { src: GAMES[k].icon, alt: '' }),
        el('span', { text: GAMES[k].name + ' · ' + fmt(t.words, { n: GAMES[k].words }) })
      ]);
    })),
    el('details', { class: 'all-types' }, [
      el('summary', { text: t.allTypes }),
      el('dl', {}, TYPES.reduce(function (list, k) {
        list.push(el('dt', { class: k === typeKey ? 'mine' : '', text: t.types[k][0] }));
        list.push(el('dd', { text: t.typeShort[k] }));
        return list;
      }, []))
    ]),
    el('p', { class: 'small', text: t.plan }),
    el('div', { class: 'actions' }, [
      shareBtn,
      el('button', { class: 'cta secondary', type: 'button', text: t.retake, onclick: restart })
    ])
  );
  window.scrollTo(0, 0);
}

document.querySelectorAll('.langs button').forEach(function (b) {
  b.onclick = function () { setLang(b.getAttribute('data-lang')); };
});
setLang(pickLang());
</script>
